  --ff:'Vazirmatn','IRANSansX','IRANSans','Sahel','Segoe UI',Tahoma,system-ui,-apple-system,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;padding:0;font-family:var(--ff);color:var(--txt);background:var(--bg);
  direction:rtl;text-align:right;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(120% 80% at 50% 0%, rgba(60,80,105,.30), transparent 60%),
    radial-gradient(90% 60% at 50% 100%, rgba(20,28,40,.9), transparent 70%),
    linear-gradient(180deg, rgba(4,6,9,.58), rgba(4,6,9,.86)),
    var(--bg-pattern);
  background-size:auto,auto,auto,cover;
  background-repeat:no-repeat;
  background-position:center;
  background-attachment:fixed;
}
body::after{/* vignette */
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  box-shadow:inset 0 0 190px 55px rgba(0,0,0,.72);
}
img{max-width:100%;display:block}
button{font-family:inherit}
input,select,textarea{font-family:inherit}
a{color:var(--crystal-1);text-decoration:none}
::selection{background:rgba(143,227,255,.3)}

/* ---------- Layout ---------- */
.app{
  position:relative;z-index:1;width:100%;max-width:470px;margin:0 auto;
  min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));
  gap:14px;
}
.grow{flex:1}
.center-col{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.hidden{display:none!important}

/* ---------- Brand ---------- */
.brand{display:flex;align-items:center;gap:10px;justify-content:center}
.brand-mark{width:44px;height:44px;filter:drop-shadow(0 4px 12px rgba(143,227,255,.35))}
.brand-mark svg{width:100%;height:100%}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-title{
  font-size:27px;font-weight:900;letter-spacing:.5px;
  background:linear-gradient(180deg,var(--silver-1) 0%,var(--silver-2) 45%,var(--silver-3) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 2px 14px rgba(180,210,240,.16);
}
.brand-sub{font-size:11.5px;color:var(--muted);letter-spacing:2.5px}

/* ---------- Panels ---------- */
.card{
  position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);
  backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(210,230,255,.45),transparent);
}
.card-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin:0 0 12px}
.card-title .ico{width:20px;height:20px;color:var(--crystal-1)}
.soft{background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}

/* ---------- Buttons ---------- */
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  width:100%;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--line-2);
  background:linear-gradient(180deg,rgba(62,72,89,.95),rgba(30,36,46,.95));
  color:var(--silver-1);font-size:15.5px;font-weight:800;cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .12s ease, filter .18s ease, box-shadow .18s ease;
  overflow:hidden;
}
.btn:active{transform:translateY(2px) scale(.99);filter:brightness(.95)}
.btn .ico{width:20px;height:20px;flex:none}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{
  background:linear-gradient(180deg,#2f4c60,#16242f);
  border-color:rgba(143,227,255,.45);color:#eaf9ff;
  box-shadow:0 10px 26px rgba(20,90,120,.42), inset 0 1px 0 rgba(255,255,255,.18);
}
.btn-primary .ico{color:var(--crystal-1)}
.btn-gold{
  background:linear-gradient(180deg,#f0c463,#a9761d);
  border-color:rgba(255,221,150,.5);color:#2a1d05;
  box-shadow:0 10px 26px rgba(160,110,20,.35), inset 0 1px 0 rgba(255,255,255,.4);
}
.btn-gold .ico{color:#3a2806}
.btn-ghost{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--silver-2);font-weight:700}
.btn-danger{background:linear-gradient(180deg,#5c2230,#341118);border-color:rgba(255,107,107,.4);color:#ffd9d9}
.btn-danger .ico{color:var(--danger)}
.btn-sm{padding:10px 12px;font-size:13.5px;border-radius:12px}
.btn-icon{width:42px;height:42px;padding:0;border-radius:13px;flex:none}
.btn-shine::after{
  content:'';position:absolute;top:0;bottom:0;width:38%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);
  transform:skewX(-18deg);animation:shine 3.6s ease-in-out infinite;
}
@keyframes shine{0%{right:-45%}55%{right:115%}100%{right:115%}}

/* ---------- Chips / badges ---------- */
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;
  background:rgba(12,16,22,.72);border:1px solid var(--line);font-size:13px;font-weight:800;
}
.chip .ico{width:17px;height:17px}
.chip-gold{border-color:rgba(226,169,63,.45);color:var(--gold-1)}
.chip-gold .ico{color:var(--gold-1)}
.chip-cup{border-color:rgba(143,227,255,.35);color:var(--crystal-1)}
.chip-cup .ico{color:var(--crystal-1)}
.badge{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge-ok{color:var(--ok);border-color:rgba(95,217,146,.4);background:rgba(95,217,146,.09)}
.badge-bad{color:var(--danger);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.09)}

/* ---------- Avatar ---------- */
.avatar{
  width:54px;height:54px;border-radius:50%;flex:none;overflow:hidden;
  background:radial-gradient(circle at 50% 30%,#2b3442,#10141b);
  border:2px solid rgba(180,205,235,.35);
  box-shadow:0 6px 18px rgba(0,0,0,.5), inset 0 0 18px rgba(143,227,255,.12);
  display:grid;place-items:center;
}
.avatar svg{width:100%;height:100%}
.avatar-lg{width:92px;height:92px;border-width:3px}
.avatar-sm{width:38px;height:38px;border-width:1.5px}

/* ---------- Forms ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin:0 3px 6px;font-weight:700}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap .ico{position:absolute;right:12px;width:19px;height:19px;color:var(--silver-3);pointer-events:none}
.input-wrap .btn-eye{position:absolute;left:8px;width:32px;height:32px;padding:0;border:0;background:transparent;color:var(--silver-3);cursor:pointer;display:grid;place-items:center}
.input-wrap .btn-eye .ico{position:static;width:19px;height:19px}
input[type=text],input[type=email],input[type=password]{
  width:100%;padding:13px 40px 13px 13px;border-radius:13px;
  background:rgba(8,11,15,.75);border:1px solid var(--line);color:var(--txt);
  font-size:14.5px;outline:none;transition:border-color .2s, box-shadow .2s;
}
input:focus{border-color:rgba(143,227,255,.55);box-shadow:0 0 0 3px rgba(56,168,216,.14)}
input::placeholder{color:#5d6a7c}
.err{color:var(--danger);font-size:12px;margin:5px 4px 0;min-height:15px;font-weight:700}
.hint-text{font-size:11.5px;color:var(--silver-3);margin:6px 4px 0;line-height:1.7}

/* ---------- Switch ---------- */
.switch{position:relative;width:48px;height:27px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{
  position:absolute;inset:0;cursor:pointer;border-radius:999px;
  background:rgba(10,13,18,.9);border:1px solid var(--line);transition:.25s;
}
.slider::before{
  content:'';position:absolute;height:19px;width:19px;right:3px;top:3px;border-radius:50%;
  background:linear-gradient(180deg,var(--silver-1),var(--silver-3));transition:.25s;
}
.switch input:checked + .slider{background:linear-gradient(180deg,#245b73,#12303d);border-color:rgba(143,227,255,.5)}
.switch input:checked + .slider::before{transform:translateX(-21px);background:linear-gradient(180deg,#d8f6ff,#61c4e6)}

/* ---------- Loading overlay (بخش ۴ سند) ---------- */
.ld-overlay{
  position:fixed;inset:0;z-index:9999;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:24px;
  background:radial-gradient(70% 55% at 50% 40%,rgba(18,28,38,.94),rgba(3,5,8,.97));
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  animation:fadeIn .25s ease;
}
.ld-overlay.on{display:flex}
.ld-ring{position:relative;width:118px;height:118px;display:grid;place-items:center}
.ld-ring::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0deg,rgba(143,227,255,.05) 90deg,var(--crystal-1) 300deg,#ffffff 360deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
  animation:spin 1.15s linear infinite;
}
.ld-ring::after{
  content:'';position:absolute;inset:11px;border-radius:50%;
  border:1px dashed rgba(170,195,225,.22);animation:spin 9s linear infinite reverse;
}
.ld-core{width:60px;height:60px;animation:float 2.4s ease-in-out infinite;color:var(--crystal-1);filter:drop-shadow(0 0 12px rgba(143,227,255,.6))}
.ld-core svg{width:100%;height:100%}
.ld-msg{font-size:15px;font-weight:800;color:var(--silver-1);text-align:center;min-height:22px}
.ld-sub{font-size:12px;color:var(--muted);text-align:center;min-height:17px}
.ld-bar{
  width:min(320px,86vw);height:11px;border-radius:999px;overflow:hidden;
  background:rgba(8,11,15,.9);border:1px solid var(--line);position:relative;
}
.ld-fill{
  height:100%;width:0%;border-radius:999px;transition:width .45s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(90deg,#1c6c8c,var(--crystal-1),#e8fbff);
  box-shadow:0 0 14px rgba(143,227,255,.65);position:relative;overflow:hidden;
}
.ld-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:sweep 1.25s linear infinite;
}
@keyframes sweep{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.ld-pct{font-size:12.5px;font-weight:900;color:var(--crystal-1);letter-spacing:1px}
.ld-warn{
  display:none;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;
  background:rgba(226,169,63,.12);border:1px solid rgba(226,169,63,.4);color:var(--gold-1);
  font-size:12.5px;font-weight:800;text-align:center;
}
.ld-warn.on{display:flex}
.ld-warn .ico{width:17px;height:17px;flex:none;animation:pulse 1s ease-in-out infinite}

/* ---------- Toast ---------- */
.toast-box{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10000;display:flex;flex-direction:column;gap:8px;width:min(420px,92vw)}
.toast{
  display:flex;align-items:center;gap:9px;padding:12px 14px;border-radius:14px;font-size:13.5px;font-weight:800;
  background:rgba(18,22,29,.96);border:1px solid var(--line-2);box-shadow:var(--shadow);
  animation:dropIn .35s cubic-bezier(.2,1.2,.4,1);backdrop-filter:blur(10px);
}
.toast .ico{width:19px;height:19px;flex:none}
.toast.ok{border-color:rgba(95,217,146,.5);color:#d7ffe8}
.toast.ok .ico{color:var(--ok)}
.toast.err{border-color:rgba(255,107,107,.5);color:#ffdede}
.toast.err .ico{color:var(--danger)}
.toast.info{border-color:rgba(143,227,255,.5);color:#dcf6ff}
.toast.info .ico{color:var(--crystal-1)}
.toast.gold{border-color:rgba(226,169,63,.55);color:#fff0cf}
.toast.gold .ico{color:var(--gold-1)}
.toast.out{animation:dropOut .3s ease forwards}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:9500;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(3,5,8,.8);backdrop-filter:blur(7px);animation:fadeIn .2s ease}
.modal.on{display:flex}
.modal-card{width:100%;max-width:400px;animation:popIn .32s cubic-bezier(.2,1.2,.4,1);max-height:86dvh;overflow:auto}
.modal-card::-webkit-scrollbar{width:5px}
.modal-card::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}

/* ---------- Animations ---------- */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(-7px)}50%{transform:translateY(7px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.92)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
@keyframes dropIn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes dropOut{to{opacity:0;transform:translateY(-14px)}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.anim-up{animation:slideUp .5s cubic-bezier(.2,.9,.3,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}.d4{animation-delay:.24s}.d5{animation-delay:.3s}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body.low-anim .btn-shine::after,body.low-anim .ld-fill::after{display:none}
body.low-anim *{animation-duration:.6s!important}

/* ---------- Helpers ---------- */
.t-c{text-align:center}
.muted{color:var(--muted)}
.small{font-size:12px}
.xsmall{font-size:11px}
.b{font-weight:900}
.sep{height:1px;background:var(--line);margin:12px 0}
.link{color:var(--crystal-1);font-weight:800;cursor:pointer}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.ico{display:inline-block;width:1em;height:1em;flex:none;vertical-align:-.15em;line-height:0}
.ico svg{width:100%;height:100%;display:block}
.fa-num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block;unicode-bidi:isolate}

</style>

<body>
<div class="app">
  <div class="g-hdr">
    <button class="btn btn-ghost btn-icon" id="btnBack" aria-label="خروج"></button>
    <div class="lives" id="lives"></div>
    <div class="row" style="gap:6px" id="chips"></div>
  </div>

  <div class="qmeta">
    <span id="qn">سؤال ۱ از ۱۰</span>
    <span class="streak hidden" id="stk"></span>
    <span class="tsec-wrap"><span class="ico" id="tico"></span><span id="tsec" class="fa-num">۳۵</span></span>
  </div>

  /* ─────────────── ۶) لودینگ گرافیکی تمام‌صفحه ─────────────── */
  const Loading = {
    el: null, _pct: 0, _locked: false,
    build() {
      if (this.el) return;
      const d = document.createElement('div');
      d.className = 'ld-overlay';
      d.innerHTML = `
        <div class="ld-ring"><div class="ld-core">${ICONS.scroll}</div></div>
        <div class="ld-msg" id="ldMsg">آماده‌سازی...</div>
        <div class="ld-bar"><div class="ld-fill" id="ldFill"></div></div>

    show(msg, sub) {
      this.build();

      U.$('#ldFill').style.width = '0%';
      U.$('#ldPct').textContent = '۰٪';
      U.$('#ldMsg').textContent = msg || 'آماده‌سازی...';
      U.$('#ldSub').textContent = sub || '';
      U.$('#ldWarn').classList.remove('on');
      this.el.classList.add('on');
      this._locked = true;
      document.body.style.overflow = 'hidden';
    },
    set(pct, msg, sub) {
      if (!this.el) this.build();
      this._pct = U.clamp(pct, 0, 100);
      U.$('#ldFill').style.width = this._pct + '%';
      U.$('#ldPct').textContent = U.fa(Math.round(this._pct)) + '٪';
      if (msg) U.$('#ldMsg').textContent = msg;
      if (sub !== undefined) U.$('#ldSub').textContent = sub || '';
    },
    warn(text) {
      if (!this.el) this.build();
      const w = U.$('#ldWarn');
      if (!text) { w.classList.remove('on'); return; }
      U.$('#ldWarnTxt').textContent = text;
      w.classList.add('on');
    },
    /* شمارش معکوس زنده هنگام تلاش مجدد (خطای 429) */
    async countdown(sec, reason) {
      for (let s = sec; s > 0; s--) {
        this.warn(`${reason || 'سرور شلوغ است'} — ${U.fa(s)} ثانیه دیگر دوباره تلاش می‌کنیم...`);
        await U.sleep(1000);
      }
      this.warn('در حال تلاش مجدد...');
      await U.sleep(250);
      this.warn('');
    },
    async hide(finalMsg, delay) {
      if (!this.el) return;
      if (finalMsg) this.set(100, finalMsg);
      await U.sleep(delay === undefined ? 420 : delay);
      this.el.classList.remove('on');
      this._locked = false;
      document.body.style.overflow = '';
    }
  };

  const SFX = {
    ctx: null,
    on() { return Settings.get().sound !== false; },
    tone(freq, dur, type, vol, delay) {
      if (!this.on()) return;
      try {
        this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
        const t0 = this.ctx.currentTime + (delay || 0);
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol || .13, t0 + .02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || .18));
        o.connect(g); g.connect(this.ctx.destination); o.start(t0); o.stop(t0 + (dur || .18) + .05);
      } catch (e) { }
    },
    click() { this.tone(430, .08, 'triangle', .07); },
    correct() { this.tone(660, .12, 'sine', .12); this.tone(880, .16, 'sine', .12, .1); this.tone(1180, .22, 'sine', .1, .2); },
    wrong() { this.tone(210, .2, 'sawtooth', .09); this.tone(150, .28, 'sawtooth', .08, .12); },
    coin() { this.tone(1050, .07, 'square', .07); this.tone(1420, .12, 'square', .06, .06); },
    win() {[0, .12, .24, .38].forEach((d, i) => this.tone([523, 659, 784, 1046][i], .3, 'triangle', .11, d)); },
    lose() {[0, .14, .3].forEach((d, i) => this.tone([392, 330, 262][i], .32, 'triangle', .1, d)); },
    vibe(ms) { if (Settings.get().vibrate !== false && navigator.vibrate) navigator.vibrate(ms || 18); }

  const Settings = {

      catch (e) { return { sound: true, vibrate: true, lowAnim: false }; }
    },
    set(patch) {
      const s = Object.assign(this.get(), patch);
      localStorage.setItem(LS.SETTINGS, JSON.stringify(s));

  /* ─────────────── ۱۰) لایه‌ی شبکه (Pantry) با تلاش مجدد ─────────────── */
  const Net = {
    _last: 0,
    _chain: Promise.resolve(),
    url(basket) { return `https://getpantry.cloud/apiv1/pantry/${CFG.PANTRY_ID}/basket/${encodeURIComponent(basket)}`; },
    request(basket, method, body) {
      const run = () => this._exec(basket, method || 'GET', body || null);
      const p = this._chain.then(run, run);
      this._chain = p.catch(() => { });
      return p;
    },
    async _exec(basket, method, body) {
      const gap = CFG.MIN_GAP_MS - (Date.now() - this._last);
      if (gap > 0) await U.sleep(gap);           // الزام: فاصله بین درخواست‌ها
      let attempt = 0;
      while (true) {
        attempt++;
        this._last = Date.now();
        let res = null, netErr = null, text = '';
        try {
          res = await fetch(this.url(basket), {
            method,
            headers: body ? { 'Content-Type': 'application/json' } : undefined,
            body: body ? JSON.stringify(body) : undefined,
            cache: 'no-store'
          });
          text = await res.text();
        } catch (e) { netErr = e; }
        this._last = Date.now();

        if (!netErr && res.status !== 429) {
          if (res.ok) { try { return text ? JSON.parse(text) : {}; } catch (e) { return {}; } }
          if (res.status === 400 && /does not exist|Could not get basket/i.test(text)) {
            const e = new Error('basket-empty'); e.code = 'EMPTY'; throw e;   // سبد هنوز ساخته نشده
          }
          const e = new Error('خطای سرور (' + res.status + ')'); e.status = res.status; throw e;
        }
        if (attempt > CFG.RETRY_DELAYS.length) {
          const e = new Error(netErr ? 'اتصال به سرور برقرار نشد؛ اینترنت را بررسی کنید.' : 'سرور خیلی شلوغ است، چند لحظه بعد دوباره تلاش کنید.');
          e.status = netErr ? 0 : 429; throw e;
        }
        let wait = CFG.RETRY_DELAYS[attempt - 1];
        if (res) { const ra = parseInt(res.headers.get('retry-after') || '0', 10); if (ra > wait) wait = ra; }
        await Loading.countdown(wait, netErr ? 'اتصال ناموفق' : 'سرور شلوغ است');
      }
    }
  };

  /* ─────────────── ۱۱) دیتابیس ─────────────── */
  function usersMap(raw) {
    const out = {};
    if (!raw) return out;
    const src = raw.users || raw;
    if (Array.isArray(src)) { src.forEach(u => { if (u && u.username) out[String(u.username).toLowerCase()] = u; }); return out; }
    if (typeof src === 'object') {
      Object.keys(src).forEach(k => {
        if (k === '_metadata') return;
        const u = src[k];
        if (u && typeof u === 'object' && (u.username || u.email)) out[String(k).toLowerCase()] = u;
      });
    }
    return out;
  }
  function blankUser(username, email, hash) {
    const e = DB.econ();
    return {
      id: U.uuid(), username: username, email: String(email).toLowerCase(), passwordHash: hash,
      status: CFG.ST_ACTIVE, banReason: '',
      coins: e.newUserCoins, cups: e.newUserCups, level: 1, xp: 0, score: 0,
      solved: 0, wrong: 0, games: 0, bestStreak: 0, bestScore: 0,
      solvedIds: [], redeemedCodes: [], avatar: 'knight',
      createdAt: U.now(), lastLogin: U.now(), updatedAt: U.now()
    };
  }
  function fillUser(u) {
    const d = blankUser(u.username || '—', u.email || '', u.passwordHash || '');
    const out = Object.assign({}, d, u);
    out.status = (u.status || (u.isBanned ? CFG.ST_BANNED : CFG.ST_ACTIVE));
    out.coins = Number(out.coins) || 0; out.cups = Number(out.cups) || 0;
    out.score = Number(out.score) || 0; out.xp = Number(out.xp) || out.score || 0;
    out.level = Math.max(1, Math.floor(out.xp / 500) + 1);
    /* سرور Pantry هنگام ادغام، آرایه‌ها را به هم می‌چسباند → تکراری‌ها را پاک می‌کنیم */
    const uniq = (v) => Array.from(new Set((Array.isArray(v) ? v : (typeof v === 'string' && v ? v.split(',') : []))
      .map(x => String(x).trim()).filter(Boolean)));
    out.redeemedCodes = uniq(out.redeemedCodes);
    out.solvedIds = uniq(out.solvedIds);
    return out;
  }

  const DB = {
    _status: null,
    /* وضعیت بازی (با کش) */
    async status(force) {
      if (!force) {
        try {
          const c = JSON.parse(sessionStorage.getItem('ch_status') || 'null');
          if (c && Date.now() - c.t < CFG.STATUS_TTL) { this._status = c.v; return c.v; }
        } catch (e) { }
      }
      let v;
      try { v = await Net.request(CFG.BASKET_STATUS); }
      catch (e) { if (e.code === 'EMPTY') v = { status: CFG.ST_ACTIVE }; else throw e; }
      v = v || {};
      if (!v.status) v.status = CFG.ST_ACTIVE;
      this._status = v;
      try { sessionStorage.setItem('ch_status', JSON.stringify({ t: Date.now(), v })); } catch (e) { }
      return v;
    },
    econ() {
      const cfg = (this._status && this._status.config) || {};
      try {
        if (!this._status) {
          const c = JSON.parse(sessionStorage.getItem('ch_status') || 'null');
          if (c && c.v && c.v.config) return Object.assign({}, CFG.ECON, c.v.config);
        }
      } catch (e) { }
      return Object.assign({}, CFG.ECON, cfg);
    },
    /* کاربران */
    async readUsers() {
      try { return usersMap(await Net.request(CFG.BASKET_USERS)); }
      catch (e) { if (e.code === 'EMPTY') return {}; throw e; }
    },
    /* نوشتن یک کاربر با PUT (ادغام عمیق) — بقیه‌ی کاربران دست‌نخورده می‌مانند
       ⚠ نکته‌ی مهم: Pantry هنگام PUT آرایه‌ها را «به هم می‌چسباند»؛ پس در آرایه‌ها
       فقط آیتم‌های جدید فرستاده می‌شود (نه کل لیست). */
    async saveUser(user) {
      const key = String(user.username).toLowerCase();
      const patch = Object.assign({}, user);
      patch.updatedAt = U.now();
      try {
        return await Net.request(CFG.BASKET_USERS, 'PUT', { users: { [key]: patch } });
      } catch (e) {
        if (e.code !== 'EMPTY') throw e;
        return Net.request(CFG.BASKET_USERS, 'POST', { users: { [key]: patch } }); // سبد هنوز ساخته نشده
      }
    },
    /* کدهای هدیه */
    async readGifts() {
      try { return await Net.request(CFG.BASKET_GIFT) || {}; }
      catch (e) { if (e.code === 'EMPTY') return {}; throw e; }
    },
    giftList(raw) {
      if (!raw) return [];
      if (Array.isArray(raw.codes)) return raw.codes.filter(Boolean);
      if (raw.codes && typeof raw.codes === 'object') return Object.values(raw.codes).filter(x => x && x.code);
      if (raw.code) return [raw];          // ساختار قدیمی: یک کد تکی
      return [];
    },
    /* نوشتن کدهای هدیه: چون آرایه‌ها با PUT به هم می‌چسبند، کل سبد با POST
       بازنویسی می‌شود (الگوی بخوان ← تغییر بده ← بنویس). */
    async saveGifts(raw, list) {
      const body = Object.assign({}, raw);
      delete body._metadata;
      if (Array.isArray(raw.codes) || (raw.codes && typeof raw.codes === 'object')) body.codes = list;
      else Object.assign(body, list[0] || {});      // ساختار قدیمی: یک کد تکی
      return Net.request(CFG.BASKET_GIFT, 'POST', body);
    }
  };

  /* ─────────────── ۱۲) نشست و احراز هویت ─────────────── */
  const Session = {
    get() { try { return JSON.parse(localStorage.getItem(LS.SESSION) || 'null'); } catch (e) { return null; } },
    set(u) {
      localStorage.setItem(LS.SESSION, JSON.stringify({ key: String(u.username).toLowerCase(), username: u.username, at: Date.now() }));
      this.profile(u);
    },
    profile(u) {
      if (u === undefined) { try { return JSON.parse(localStorage.getItem(LS.PROFILE) || 'null'); } catch (e) { return null; } }
      localStorage.setItem(LS.PROFILE, JSON.stringify(u)); return u;
    },
    clear() { localStorage.removeItem(LS.SESSION); localStorage.removeItem(LS.PROFILE); sessionStorage.removeItem('ch_status'); }
  };

  /* جوایزی که به‌خاطر قطعی اینترنت روی سرور ثبت نشده‌اند */
  const Pending = {
    get() { try { return JSON.parse(localStorage.getItem(LS.PENDING) || 'null'); } catch (e) { return null; } },
    add(d) {
      const p = this.get() || { coins: 0, cups: 0 };
      p.coins = (p.coins || 0) + (Number(d.coins) || 0);
      p.cups = (p.cups || 0) + (Number(d.cups) || 0);
      localStorage.setItem(LS.PENDING, JSON.stringify(p));
    },
    clear() { localStorage.removeItem(LS.PENDING); },
    apply(u) {                       // جایزه‌ی معلق را روی پروفایل اعمال می‌کند
      const p = this.get();
      if (!p || (!p.coins && !p.cups)) return false;
      u.coins = (u.coins || 0) + (p.coins || 0);
      u.cups = (u.cups || 0) + (p.cups || 0);
      return true;
    }
  };

  const Auth = {
    async register({ username, email, password, avatar }) {
      username = String(username || '').trim();
      email = String(email || '').trim().toLowerCase();
      Loading.show('آماده‌سازی ثبت‌نام...', 'در حال بررسی اطلاعات وارد شده');
      Loading.set(12, 'در حال رمزگذاری اطلاعات...');
      const hash = await sha256(password);
      Loading.set(28, 'در حال اتصال به سرور...', 'سرور اطلاعات کاربر');
      const users = await DB.readUsers();                      // ۱) خواندن
      Loading.set(55, 'در حال بررسی نام کاربری...');
      if (users[username.toLowerCase()]) { await Loading.hide(); throw new Error('این نام کاربری قبلاً ثبت شده است.'); }
      if (Object.values(users).some(u => (u.email || '').toLowerCase() === email)) {
        await Loading.hide(); throw new Error('این ایمیل قبلاً استفاده شده است.');
      }
      await U.sleep(1000);                                     // الزام: ۱ ثانیه فاصله
      Loading.set(72, 'در حال ذخیره‌سازی حساب...', 'اطلاعات قبلی حفظ می‌شود');
      const user = blankUser(username, email, hash);
      if (avatar) user.avatar = avatar;
      await DB.saveUser(user);                                 // ۲و۳) افزودن + نوشتن
      Session.set(user);
      Loading.set(100, 'ثبت‌نام با موفقیت انجام شد!', 'خوش آمدی ' + username);
      await U.sleep(700); await Loading.hide(null, 0);
      return user;
    },
    async login({ id, password }) {
      id = String(id || '').trim().toLowerCase();
      Loading.show('در حال ورود...', 'در حال اتصال به سرور');
      Loading.set(15, 'در حال رمزگذاری رمز عبور...');
      const hash = await sha256(password);
      Loading.set(35, 'در حال دریافت اطلاعات حساب...');
      const users = await DB.readUsers();
      Loading.set(70, 'در حال بررسی اطلاعات...');
      let u = users[id];
      if (!u) u = Object.values(users).find(x => (x.email || '').toLowerCase() === id || String(x.username || '').toLowerCase() === id);
      if (!u) { await Loading.hide(); throw new Error('کاربری با این مشخصات پیدا نشد.'); }
      const ok = (u.passwordHash === hash) || (u.passwordSalt && u.passwordHash === await sha256(u.passwordSalt + ':' + password));
      if (!ok) { await Loading.hide(); throw new Error('رمز عبور اشتباه است.'); }
      const user = fillUser(u);
      user.lastLogin = U.now();
      Session.set(user);
      if (user.status === CFG.ST_BANNED) {
        Loading.set(100, 'دسترسی مسدود است'); await U.sleep(500); await Loading.hide(null, 0);
        U.go('banned.html'); throw new Error('__banned__');
      }
      Loading.set(100, 'خوش برگشتی ' + user.username + '!');
      DB.saveUser({ username: user.username, lastLogin: user.lastLogin }).catch(() => { }); // بی‌صدا
      await U.sleep(600); await Loading.hide(null, 0);
      return user;
    },
    async changePassword(current, next) {
      const s = Session.get(); if (!s) throw new Error('ابتدا وارد شوید.');
      Loading.show('در حال تغییر رمز عبور...');
      Loading.set(25, 'در حال دریافت اطلاعات حساب...');
      const users = await DB.readUsers();
      const u = users[s.key];
      if (!u) { await Loading.hide(); throw new Error('حساب پیدا نشد.'); }
      const curHash = await sha256(current);
      const ok = (u.passwordHash === curHash) || (u.passwordSalt && u.passwordHash === await sha256(u.passwordSalt + ':' + current));
      if (!ok) { await Loading.hide(); throw new Error('رمز فعلی اشتباه است.'); }
      await U.sleep(1000);
      Loading.set(70, 'در حال ذخیره‌ی رمز جدید...');
      const nh = await sha256(next);
      await DB.saveUser({ username: u.username, passwordHash: nh, passwordSalt: '' });
      const p = Session.profile(); if (p) { p.passwordHash = nh; Session.profile(p); }
      Loading.set(100, 'رمز عبور تغییر کرد.');
      await U.sleep(500); await Loading.hide(null, 0);
    },
    /* همگام‌سازی پروفایل با سرور (+ بررسی مسدودی) */
    async refresh(silent) {
      const s = Session.get(); if (!s) return null;
      if (!silent) { Loading.show('در حال همگام‌سازی...', 'دریافت اطلاعات از سرور'); Loading.set(35, 'در حال دریافت اطلاعات...'); }
      try {
        const users = await DB.readUsers();
        const raw = users[s.key];
        if (!raw) { if (!silent) await Loading.hide(); return null; }
        const u = fillUser(raw);
        /* اگر جایزه‌ای قبلاً به‌خاطر قطعی ثبت نشده، همین‌جا اعمالش کن */
        if (Pending.apply(u)) {
          Session.profile(u);
          DB.saveUser({ username: u.username, coins: u.coins, cups: u.cups })
            .then(() => { Pending.clear(); toast('جایزه‌ی معلق به حسابت اضافه شد.', 'gold'); })
            .catch(() => { });
        }
        Session.profile(u);
        if (!silent) { Loading.set(100, 'به‌روزرسانی شد'); await Loading.hide(null, 0); }
        if (u.status === CFG.ST_BANNED) { U.go('banned.html'); return u; }
        return u;
      } catch (e) {
        if (!silent) { await Loading.hide(); toast(e.message, 'err'); }
        return null;
      }
    },
    logout() { Session.clear(); U.go('login.html'); }
  };

  /* ─────────────── ۱۳) ذخیره‌ی پیشرفت بازی ─────────────── */
  async function saveProgress(patch, opts) {
    const p = Session.profile(); if (!p) throw new Error('حسابی وارد نشده است.');
    const newIds = (patch.__newSolved || []).map(String);
    delete patch.__newSolved;
    Object.assign(p, patch);
    const hadPending = Pending.apply(p);     // جایزه‌ی معلق را هم همین‌جا ذخیره کن
    p.level = Math.max(1, Math.floor((p.xp || 0) / 500) + 1);
    p.solvedIds = Array.from(new Set((p.solvedIds || []).map(String).concat(newIds)));
    Session.profile(p);
    const quiet = opts && opts.quiet;
    if (!quiet) { Loading.show('در حال ذخیره‌ی نتیجه...', 'ارسال به سرور اطلاعات کاربر'); Loading.set(40, 'در حال ذخیره‌سازی...'); }
    try {
      const body = {
        username: p.username, coins: p.coins, cups: p.cups, xp: p.xp, score: p.score, level: p.level,
        solved: p.solved, wrong: p.wrong, games: p.games, bestStreak: p.bestStreak, bestScore: p.bestScore,
        avatar: p.avatar, lastLogin: U.now()
      };
      if (newIds.length) body.solvedIds = newIds;   // فقط موارد جدید (سرور به لیست قبلی اضافه می‌کند)
      await DB.saveUser(body);
      if (hadPending) Pending.clear();
      if (!quiet) { Loading.set(100, 'ذخیره شد!'); await Loading.hide(null, 350); }
      return true;
    } catch (e) {
      if (!quiet) { await Loading.hide(); toast('ذخیره در سرور ناموفق بود: ' + e.message, 'err', 4200); }
      return false;
    }
  }

  /* ─────────────── ۱۴) دریافت کد هدیه ─────────────── */
  async function redeemCode(codeInput) {
    const p = Session.profile(); if (!p) throw new Error('ابتدا وارد حساب شوید.');
    const code = String(codeInput || '').trim().toUpperCase();
    if (!code) throw new Error('کد هدیه را وارد کنید.');
    Loading.show('در حال بررسی کد هدیه...', 'اتصال به سرور کد جایزه');
    Loading.set(25, 'در حال دریافت لیست کدها...');
    const raw = await DB.readGifts();
    const list = DB.giftList(raw);
    Loading.set(55, 'در حال اعتبارسنجی کد...');
    const item = list.find(c => String(c.code || '').trim().toUpperCase() === code);
    const fail = async (m) => { await Loading.hide(); throw new Error(m); };
    if (!item) await fail('این کد معتبر نیست.');
    const active = item.active;
    const isActive = active === undefined || active === true || active === CFG.ST_ACTIVE || active === 'true' || active === 1;
    if (!isActive) await fail('این کد غیرفعال شده است.');
    if (item.expires && new Date(item.expires).getTime() < Date.now()) await fail('اعتبار این کد تمام شده است.');
    const usedBy = Array.isArray(item.usedBy) ? item.usedBy : [];
    const me = String(p.username).toLowerCase();
    if (usedBy.some(x => String(x).toLowerCase() === me)) await fail('شما قبلاً از این کد استفاده کرده‌اید.');
    if (item.maxUses && usedBy.length >= Number(item.maxUses)) await fail('ظرفیت این کد تکمیل شده است.');

    usedBy.push(p.username);
    item.usedBy = Array.from(new Set(usedBy.map(x => String(x).trim()).filter(Boolean)));
    item.uses = item.usedBy.length;
    await U.sleep(1000);
    Loading.set(75, 'در حال ثبت استفاده از کد...');
    await DB.saveGifts(raw, list);
    await U.sleep(1000);
    Loading.set(90, 'در حال افزودن جایزه به حساب شما...');
    p.coins = (p.coins || 0) + (Number(item.coins) || 0);
    p.cups = (p.cups || 0) + (Number(item.cups) || 0);
    p.redeemedCodes = Array.from(new Set((p.redeemedCodes || []).map(String).concat([code])));
    Session.profile(p);
    try {
      // فقط کد جدید فرستاده می‌شود؛ سرور آن را به لیست قبلی اضافه می‌کند
      await DB.saveUser({ username: p.username, coins: p.coins, cups: p.cups, redeemedCodes: [code] });
    } catch (e) {
      // کد مصرف شده ولی ذخیره‌ی سکه ناموفق بود → جایزه معلق می‌ماند و بعداً خودکار اعمال می‌شود
      Pending.add({ coins: Number(item.coins) || 0, cups: Number(item.cups) || 0 });
      Loading.set(100, 'جایزه ثبت شد');
      await U.sleep(400); await Loading.hide(null, 0);
      toast('جایزه ثبت شد؛ در اولین اتصال موفق به حسابت اضافه می‌شود.', 'gold', 4500);
      return { coins: Number(item.coins) || 0, cups: Number(item.cups) || 0, deferred: true };
    }
    Loading.set(100, 'جایزه دریافت شد!');
    await U.sleep(600); await Loading.hide(null, 0);
    return { coins: Number(item.coins) || 0, cups: Number(item.cups) || 0 };
  }

  /* ─────────────── ۱۵) نگهبان صفحات ─────────────── */
  async function boot(opts) {
    opts = opts || {};
    Settings.apply();
    Loading.build();
    const s = Session.get();
    if (opts.need === 'auth' && !s) { U.go('login.html'); return { stop: true }; }
    if (opts.need === 'guest' && s) { U.go('menu.html'); return { stop: true }; }
    if (opts.checkStatus !== false) {
      try {
        const st = await DB.status();
        if (st.status === CFG.ST_UPDATE || st.status === CFG.ST_MAINT) {
          if (!/update\.html/.test(location.pathname)) { U.go('update.html'); return { stop: true }; }
        }
      } catch (e) { /* آفلاین: اجازه‌ی ادامه */ }
    }
    const p = Session.profile();
    if (p && p.status === CFG.ST_BANNED && !/banned\.html/.test(location.pathname)) { U.go('banned.html'); return { stop: true }; }
    return { stop: false, profile: p };
  }

  /* ─────────────── ۱۶) قطعات رابط کاربری مشترک ─────────────── */
  function coinChip(v) { return `<span class="chip chip-gold">${icon('coin')}<span class="fa-num" id="chipCoins">${U.num(v)}</span></span>`; }
  function cupChip(v) { return `<span class="chip chip-cup">${icon('cup')}<span class="fa-num" id="chipCups">${U.num(v)}</span></span>`; }
  function topBar(title, backHref) {
    return `<div class="row between">
      <a class="btn btn-ghost btn-icon" href="${backHref || 'menu.html'}" aria-label="بازگشت">${icon('back')}</a>
      <div class="b" style="font-size:16px">${U.esc(title)}</div>
      <div style="width:42px"></div>
    </div>`;
  }

  return {
    CFG, U, icon, ICONS, AV, AV_KEYS, avatarSvg, avatarName, sha256,
    Loading, toast, SFX, Settings, Net, DB, Session, Auth, Pending,
    saveProgress, redeemCode, boot, fillUser, coinChip, cupChip, topBar
  };
})();

</script>
<script>
(async function () {
  const { U, icon, ICONS, DB, Session, SFX, toast } = CH;
  U.$('#btnBack').innerHTML = ICONS.back;
  U.$('#qq').innerHTML = ICONS.scroll;
  U.$('#tico').innerHTML = ICONS.clock;
  U.$('#hFifty .ico').innerHTML = ICONS.half;
  U.$('#hHint .ico').innerHTML = ICONS.bulb;
  U.$('#hSkip .ico').innerHTML = ICONS.skip;
  U.$('#againIco').innerHTML = `<span class="ico">${ICONS.refresh}</span>`;
  U.$('#menuIco').innerHTML = `<span class="ico">${ICONS.home}</span>`;
  U.$('#qT').innerHTML = icon('alert') + '<span>خروج از بازی</span>';

  const st = await CH.boot({ need: 'auth' });
  if (st.stop) return;

  const P = Session.profile();
  const E = DB.econ();
  const TOTAL = Math.max(3, Number(E.questionsPerRound) || 10);
  const TIME = Math.max(10, Number(E.timePerQuestion) || 35);
  const LETTERS = ['الف', 'ب', 'ج', 'د'];

  U.$('#hFifty .cost').innerHTML = icon('coin') + U.fa(E.fiftyCost);
  U.$('#hHint .cost').innerHTML = icon('coin') + U.fa(E.hintCost);
  U.$('#hSkip .cost').innerHTML = icon('coin') + U.fa(E.skipCost);

  /* ---------- انتخاب سؤال‌ها (اول سؤال‌های حل‌نشده) ---------- */
  const all = window.RIDDLES.slice();
  const seen = (Array.isArray(P.solvedIds) ? P.solvedIds : []).map(String);
  const fresh = U.shuffle(all.filter(r => !seen.includes(String(r.id))));
  let QS = fresh.slice(0, TOTAL);
  if (QS.length < TOTAL) {                                        // همه را حل کرده: تکرار تصادفی
    const rest = U.shuffle(all.filter(r => QS.indexOf(r) === -1));
    QS = QS.concat(rest.slice(0, TOTAL - QS.length));
  }

  /* ---------- وضعیت دور ---------- */
  const S = {
    i: 0, lives: Math.max(1, Number(E.lives) || 3), correct: 0, wrong: 0,
    coins: 0, cups: 0, score: 0, streak: 0, best: 0, locked: false,
    coinsNow: P.coins || 0, cupsNow: P.cups || 0, newSolved: []
  };
  let timer = null, left = TIME;

  const drawChips = () => { U.$('#chips').innerHTML = CH.coinChip(S.coinsNow) + CH.cupChip(S.cupsNow); };
  const drawLives = () => {
    U.$('#lives').innerHTML = Array.from({ length: Math.max(1, Number(E.lives) || 3) },
      (_, i) => `<span class="ico ${i < S.lives ? '' : 'off'}">${i < S.lives ? ICONS.heart : ICONS.heartOff}</span>`).join('');
  };
  const drawStreak = () => {
    const el = U.$('#stk');
    if (S.streak >= 2) { el.classList.remove('hidden'); el.innerHTML = icon('bolt') + 'زنجیره ' + U.fa(S.streak); }
    else el.classList.add('hidden');
  };
  function fly(text, ic, color) {
    const d = document.createElement('div');
    d.className = 'fly'; d.style.color = color || 'var(--gold-1)';
    d.innerHTML = `<span>${U.esc(text)}</span>` + (ic ? icon(ic) : '');
    d.style.left = '50%'; d.style.top = '42%'; d.style.transform = 'translateX(-50%)';
    document.body.appendChild(d); setTimeout(() => d.remove(), 1150);
  }

  /* ---------- تایمر ---------- */
  function startTimer() {
    stopTimer(); left = TIME;
    U.$('#tsec').textContent = U.fa(TIME);
    const f = U.$('#tfill'); f.className = 'tfill'; f.style.width = '100%';
    const t0 = Date.now();
    timer = setInterval(() => {
      const el = (Date.now() - t0) / 1000;
      left = Math.max(0, TIME - el);
      const pct = left / TIME * 100;
      f.style.width = pct + '%';
      f.className = 'tfill' + (pct < 22 ? ' danger' : pct < 45 ? ' warn' : '');
      U.$('#tsec').textContent = U.fa(Math.ceil(left));
      if (left <= 0) { stopTimer(); timeUp(); }
    }, 110);
  }
  const stopTimer = () => { if (timer) clearInterval(timer); timer = null; };

  /* ---------- رندر سؤال ---------- */
  function render() {
    const q = QS[S.i];
    S.locked = false;
    U.$('#qn').textContent = `سؤال ${U.fa(S.i + 1)} از ${U.fa(QS.length)}`;
    U.$('#qcat').textContent = q.c || 'چیستان';
    U.$('#qdiff').innerHTML = [1, 2, 3].map(n => `<span class="ico">${n <= (q.d || 1) ? ICONS.star : ICONS.starOff}</span>`).join('');
    const card = U.$('#qcard'); card.classList.remove('anim-up'); void card.offsetWidth; card.classList.add('anim-up');
    U.$('#qtext').textContent = q.q;
    U.$('#qhint').classList.remove('on'); U.$('#qhint').innerHTML = '';
    U.$$('.help-b').forEach(b => b.classList.remove('used'));

    const shuffled = U.shuffle(q.o.map((t, idx) => ({ t, ok: idx === 0 })));
    U.$('#opts').innerHTML = shuffled.map((o, i) =>
      `<button class="opt anim-up d${i + 1}" data-ok="${o.ok ? 1 : 0}">
         <span class="k">${LETTERS[i]}</span>
         <span class="tx">${U.esc(o.t)}</span>
         <span class="ico mk"></span>
       </button>`).join('');
    U.$$('.opt').forEach(b => b.onclick = () => answer(b));
    drawLives(); drawStreak(); drawChips();
    startTimer();
  }

  /* ---------- پاسخ ---------- */
  function answer(btn) {
    if (S.locked) return;
    S.locked = true; stopTimer();
    const q = QS[S.i];
    const ok = btn.dataset.ok === '1';
    U.$$('.opt').forEach(b => {
      b.disabled = true;
      if (b.dataset.ok === '1') { b.classList.add('correct'); U.$('.mk', b).innerHTML = ICONS.check; }
    });
    if (ok) {
      const ratio = left / TIME;
      const timeBonus = Math.round(ratio * 50);
      const base = 100 * (q.d || 1);
      S.streak++; S.best = Math.max(S.best, S.streak);
      const chain = S.streak >= 2 ? Math.min(S.streak - 1, 4) * (Number(E.streakBonus) || 15) : 0;
      const gainScore = base + timeBonus + chain;
      const gainCoins = (Number(E.correctCoins) || 50) + ((q.d || 1) - 1) * 10 + (ratio > .6 ? (Number(E.timeBonusCoins) || 10) : 0);
      const gainCups = Number(E.correctCups) || 1;
      S.correct++; S.score += gainScore; S.coins += gainCoins; S.cups += gainCups;
      S.coinsNow += gainCoins; S.cupsNow += gainCups;
      if (!seen.includes(String(q.id))) S.newSolved.push(q.id);
      SFX.correct(); SFX.vibe(20);
      fly('+' + U.fa(gainCoins), 'coin');
      setTimeout(() => fly('+' + U.fa(gainScore) + ' امتیاز', 'bolt', 'var(--crystal-1)'), 220);
    } else {
      btn.classList.remove('correct'); btn.classList.add('wrong');
      U.$('.mk', btn).innerHTML = ICONS.x;
      S.wrong++; S.streak = 0; S.lives--;
      SFX.wrong(); SFX.vibe([25, 40, 25]);
    }
    drawLives(); drawStreak(); drawChips();
    setTimeout(next, ok ? 1250 : 1800);
  }

  function timeUp() {
    if (S.locked) return;
    S.locked = true;
    U.$$('.opt').forEach(b => {
      b.disabled = true;
      if (b.dataset.ok === '1') { b.classList.add('correct'); U.$('.mk', b).innerHTML = ICONS.check; }
    });
    S.wrong++; S.streak = 0; S.lives--;
    SFX.lose(); SFX.vibe(60);
    toast('زمان تمام شد!', 'err', 1600);
    drawLives(); drawStreak();
    setTimeout(next, 1700);
  }

  function next() {
    if (S.lives <= 0) return finish(false);
    S.i++;
    if (S.i >= QS.length) return finish(true);
    render();
  }

  /* ---------- کمک‌ها ---------- */
  function pay(cost) {
    if (S.coinsNow < cost) { toast('سکه‌ی کافی نداری!', 'err'); SFX.wrong(); return false; }
    S.coinsNow -= cost; S.coins -= cost; drawChips(); SFX.coin(); return true;
  }
  U.$('#hFifty').onclick = () => {
    if (S.locked) return;
    if (!pay(Number(E.fiftyCost) || 40)) return;
    U.$('#hFifty').classList.add('used');
    const wrongs = U.shuffle(U.$$('.opt').filter(b => b.dataset.ok !== '1'));
    wrongs.slice(0, 2).forEach(b => b.classList.add('dim'));
  };
  U.$('#hHint').onclick = () => {
    if (S.locked) return;
    if (!pay(Number(E.hintCost) || 25)) return;
    U.$('#hHint').classList.add('used');
    const h = QS[S.i].h || 'راهنمایی‌ای برای این سؤال ثبت نشده است.';
    U.$('#qhint').innerHTML = icon('bulb') + U.esc(h);
    U.$('#qhint').classList.add('on');
  };
  U.$('#hSkip').onclick = () => {
    if (S.locked) return;
    if (!pay(Number(E.skipCost) || 30)) return;
    S.locked = true; stopTimer();
    toast('سؤال رد شد.', 'info', 1400);
    setTimeout(() => { S.i++; (S.i >= QS.length) ? finish(true) : render(); }, 450);
  };

  /* ---------- پایان دور ---------- */
  async function finish(completed) {
    stopTimer();
    const tot = S.correct + S.wrong;
    const acc = tot ? Math.round(S.correct * 100 / tot) : 0;
    completed && S.correct === QS.length ? SFX.win() : (S.correct > 0 ? SFX.win() : SFX.lose());

    U.$('#endIco').innerHTML = `<span class="ico" style="width:46px;height:46px;color:${S.correct >= QS.length / 2 ? 'var(--gold-1)' : 'var(--silver-3)'}">${S.correct >= QS.length / 2 ? ICONS.medal : ICONS.shield}</span>`;
    U.$('#endTitle').textContent = !completed ? 'جان‌هایت تمام شد!' : (S.correct === QS.length ? 'عالی بود! همه را درست زدی' : 'دور تمام شد');
    U.$('#endSub').textContent = `${U.fa(S.correct)} پاسخ درست از ${U.fa(tot)} سؤال`;

    const R = 52, C = 2 * Math.PI * R;
    U.$('#ring').innerHTML = `
      <svg width="118" height="118" viewBox="0 0 118 118">
        <circle cx="59" cy="59" r="${R}" fill="none" stroke="rgba(170,190,215,.14)" stroke-width="9"/>
        <circle cx="59" cy="59" r="${R}" fill="none" stroke="#8fe3ff" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C - C * acc / 100}" style="filter:drop-shadow(0 0 6px rgba(143,227,255,.7))"/>
      </svg>
      <div class="val"><div>${U.fa(acc)}٪<small>دقت</small></div></div>`;

    U.$('#endRows').innerHTML = `
      <div class="res-row"><span>${icon('check')}پاسخ درست</span><b class="fa-num" style="color:var(--ok)">${U.fa(S.correct)}</b></div>
      <div class="res-row"><span>${icon('x')}پاسخ اشتباه</span><b class="fa-num" style="color:var(--danger)">${U.fa(S.wrong)}</b></div>
      <div class="res-row"><span>${icon('bolt')}امتیاز این دور</span><b class="fa-num">${U.num(S.score)}</b></div>
      <div class="res-row"><span>${icon('coin')}سکه‌ی کسب‌شده</span><b class="fa-num" style="color:var(--gold-1)">${(S.coins >= 0 ? '+' : '') + U.num(S.coins)}</b></div>
      <div class="res-row"><span>${icon('cup')}جام کسب‌شده</span><b class="fa-num" style="color:var(--crystal-1)">+${U.num(S.cups)}</b></div>
      <div class="res-row"><span>${icon('bolt')}بهترین زنجیره</span><b class="fa-num">${U.fa(S.best)}</b></div>`;
    U.$('#mEnd').classList.add('on');

    /* ذخیره روی سرور — فقط یک درخواست */
    const p = Session.profile();
    await CH.saveProgress({
      coins: S.coinsNow, cups: S.cupsNow,
      xp: (p.xp || 0) + S.score, score: (p.score || 0) + S.score,
      solved: (p.solved || 0) + S.correct, wrong: (p.wrong || 0) + S.wrong,
      games: (p.games || 0) + 1,
      bestStreak: Math.max(p.bestStreak || 0, S.best),
      bestScore: Math.max(p.bestScore || 0, S.score),
      __newSolved: S.newSolved
    });
  }

  U.$('#again').onclick = () => location.reload();
  U.$('#toMenu').onclick = () => U.go('menu.html');

  /* ---------- خروج ---------- */
  U.$('#btnBack').onclick = () => {
    if (U.$('#mEnd').classList.contains('on')) return U.go('menu.html');
    stopTimer(); U.$('#mQuit').classList.add('on');
  };
  U.$('#qNo').onclick = () => { U.$('#mQuit').classList.remove('on'); if (!S.locked) startTimer(); };
  U.$('#qYes').onclick = () => U.go('menu.html');

  drawChips(); drawLives(); render();
})();
</script>
</body>
</html>
